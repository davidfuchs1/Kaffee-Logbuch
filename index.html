<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kaffee-Logbuch</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kaffeebuch">
<meta name="theme-color" content="#1B1512">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="farben.css">
<link rel="stylesheet" href="stil.css">
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="titles">
      <h1>Kaffee-Logbuch</h1>
      <p>dein privates Brüh-Protokoll</p>
    </div>
    <div class="icon-btns">
      <button class="icon-btn" id="btnExport" title="Sichern (JSON exportieren)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
      </button>
      <button class="icon-btn" id="btnImport" title="Wiederherstellen (JSON importieren)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9"/><path d="M17 14l-5-5-5 5"/><path d="M5 3h14"/></svg>
      </button>
      <input type="file" id="fileImport" accept="application/json">
    </div>
  </header>

  <div class="toolbar">
    <span class="count" id="countLbl">0 Einträge</span>
    <div class="sort">
      <button data-sort="date" class="active">Neueste</button>
      <button data-sort="rating">Beste</button>
    </div>
  </div>

  <div class="list" id="list"></div>
</div>

<button class="fab" id="btnAdd" aria-label="Neuen Kaffee eintragen">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2 id="sheetTitle">Neuer Kaffee</h2>

    <div class="warn" id="dupWarning" hidden>Für diesen Kaffee bei dieser Rösterei gibt es bereits ein Rezept. Jeder Kaffee kann pro Rösterei nur einmal angelegt werden.</div>

    <div class="field">
      <label for="fName">Kaffee</label>
      <input type="text" id="fName" placeholder="z. B. Ethiopia Guji">
    </div>
    <div class="field">
      <label for="fRoastery">Rösterei</label>
      <input type="text" id="fRoastery" placeholder="z. B. Bonanza">
    </div>

    <div class="field">
      <label>Gramm ein / Gramm aus</label>
      <div class="row2">
        <div class="stepper">
          <button type="button" class="step-btn" data-target="fIn" data-step="-1" data-min="0">−</button>
          <div class="step-value"><input type="number" id="fIn" inputmode="decimal" placeholder="18"><span class="step-unit">g ein</span></div>
          <button type="button" class="step-btn" data-target="fIn" data-step="1" data-min="0">+</button>
        </div>
        <div class="stepper">
          <button type="button" class="step-btn" data-target="fOut" data-step="-1" data-min="0">−</button>
          <div class="step-value"><input type="number" id="fOut" inputmode="decimal" placeholder="40"><span class="step-unit">g aus</span></div>
          <button type="button" class="step-btn" data-target="fOut" data-step="1" data-min="0">+</button>
        </div>
      </div>
      <div class="ratio-live" id="ratioLive">Verhältnis 1 : —</div>
    </div>

    <div class="field">
      <label>Brühzeit (Sekunden)</label>
      <div class="stepper">
        <button type="button" class="step-btn" data-target="fSec" data-step="-1" data-min="0">−</button>
        <div class="step-value"><input type="number" id="fSec" inputmode="numeric" placeholder="25"><span class="step-unit">Sekunden</span></div>
        <button type="button" class="step-btn" data-target="fSec" data-step="1" data-min="0">+</button>
      </div>
    </div>

    <div class="field grind-wrap">
      <label>Mahlgrad</label>
      <input type="range" id="fGrind" min="-1" max="20" step="0.1" value="10">
      <div class="grind-label" id="grindLbl">10,0</div>
    </div>

    <div class="field">
      <label>Bewertung</label>
      <div class="bean-picker" id="beanPicker"></div>
      <div class="bean-rating-label" id="ratingLbl">Noch keine Bewertung</div>
    </div>

    <div class="field">
      <label>Geschmack</label>
      <div class="chips" id="flavorChips"></div>
      <div class="flavor-new">
        <input type="text" id="fFlavorNew" placeholder="Eigene Note" maxlength="30" enterkeyhint="done" aria-label="Eigene Note">
        <button type="button" id="btnFlavorAdd" aria-label="Eigene Note hinzufügen">+</button>
      </div>
    </div>

    <div class="field">
      <label for="fNotes">Bemerkungen</label>
      <textarea id="fNotes" placeholder="Geschmack und besondere Merkmale"></textarea>
    </div>

    <div class="sheet-actions">
      <button class="btn btn-ghost" id="btnCancel">Abbrechen</button>
      <button class="btn btn-primary" id="btnSave">Speichern</button>
    </div>
    <div class="sheet-actions" id="deleteRow" hidden>
      <button class="btn btn-danger" id="btnDelete">Eintrag löschen</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
